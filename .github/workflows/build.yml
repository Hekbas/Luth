name: Build

on:
  push:
    branches: [feature-linux-support]
  pull_request:
    branches: [feature-linux-support]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        config: [Debug, Release, Dist]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache submodules
      uses: actions/cache@v4
      with:
        path: luth/extern/source
        key: submodules-${{ hashFiles('.gitmodules') }}

    - name: Setup script permissions
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x extern/premake/linux/premake5
        chmod +x scripts/setup/setup_linux.sh
        chmod +x scripts/build/build_linux.sh

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          xorg-dev \
          libgl1-mesa-dev \
          libvulkan-dev

    - name: Run premake (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        cd scripts\setup
        setup_windows.bat

    - name: Run premake (Linux)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        cd scripts/setup
        chmod +x setup_linux.sh
        ./setup_linux.sh

    - name: Setup MSBuild
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v1

    - name: Cache build intermediates (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v4
      with:
        path: bin-int
        key: build-int-windows-${{ matrix.config }}-${{ hashFiles('**/*.h', '**/*.cpp', '**/*.lua') }}
        restore-keys: |
          build-int-windows-${{ matrix.config }}-

    - name: Build ${{ matrix.config }} (Windows)
      if: matrix.os == 'windows-latest'
      run: >
        msbuild Luth.sln
        /p:Configuration=${{ matrix.config }}
        /p:Platform=x64
        /p:WindowsTargetPlatformVersion=10.0
        /m

    - name: Cache build intermediates (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v4
      with:
        path: bin-int
        key: build-int-linux-${{ matrix.config }}-${{ hashFiles('**/*.h', '**/*.cpp', '**/*.lua') }}
        restore-keys: |
          build-int-linux-${{ matrix.config }}-

    - name: Build ${{ matrix.config }} (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        CONFIG=$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')
        cd scripts/build
        chmod +x build_linux.sh
        ./build_linux.sh -j config=$CONFIG

    - name: Upload Release artifacts
      if: matrix.os == 'windows-latest' && matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: luth-release-x64
        retention-days: 14
        path: |
          bin/windows-x86_64/Release/Runtime/Luthien.exe
          bin/windows-x86_64/Release/Runtime/shaderc_shared.dll
          bin/windows-x86_64/Release/Luth/Luth.lib
