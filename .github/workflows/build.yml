name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        config: [Debug, Release, Dist]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # No submodule cache: checkout already fetches submodules, and caching
    # luth/extern/source by .gitmodules hash clobbered vendored in-tree deps
    # (e.g. imguizmo) with stale copies, reverting committed fixes.

    - name: Run premake
      shell: cmd
      run: |
        cd scripts\setup
        setup_windows.bat

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Cache build intermediates
      uses: actions/cache@v4
      with:
        path: bin-int
        key: build-int-${{ matrix.config }}-${{ hashFiles('**/*.h', '**/*.cpp', '**/*.lua') }}
        restore-keys: |
          build-int-${{ matrix.config }}-

    - name: Build ${{ matrix.config }} x64
      run: >
        msbuild Luth.sln
        /p:Configuration=${{ matrix.config }}
        /p:Platform=x64
        /p:WindowsTargetPlatformVersion=10.0
        /m

    - name: Upload Release artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: luth-release-x64
        retention-days: 14
        path: |
          bin/windows-x86_64/Release/Runtime/Luthien.exe
          bin/windows-x86_64/Release/Runtime/shaderc_shared.dll
          bin/windows-x86_64/Release/Luth/Luth.lib
